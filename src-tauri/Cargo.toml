[package]
name = "qu-cs-view"
version = "1.0.0"
description = "Ultra-fast CSV/TSV Preview and In-Place Editor for Massive Files"
authors = ["QuCSV Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
memmap2 = "0.9"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
anyhow = "1.0"
rayon = "1.10"
regex = "1.10"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
